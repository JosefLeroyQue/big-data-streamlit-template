name: weather-weather-lang

# Shared settings so every service agrees on topic, database and collection names.
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092        # internal listener (service name, not localhost)
  KAFKA_TOPIC: ${KAFKA_TOPIC:-streaming-data}

x-mongo-env: &mongo-env
  MONGODB_URI: mongodb://mongodb:27017
  MONGODB_DATABASE: ${MONGODB_DATABASE:-weather_db}
  MONGODB_COLLECTION: ${MONGODB_COLLECTION:-weather_data}

services:
  # ---------------------------------------------------------------- Kafka (KRaft, no ZooKeeper)
  kafka:
    image: apache/kafka:4.3.1
    container_name: weather-kafka
    ports:
      - "9092:9092"                            # EXTERNAL listener, for tools running on your host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      # Containers use kafka:29092; the host uses localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot job: create the topic so producer and processor never race on auto-creation.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: weather-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-streaming-data}
    command:
      - /bin/sh
      - -c
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic $${KAFKA_TOPIC}
        --partitions 3 --replication-factor 1
    restart: "no"

  # ---------------------------------------------------------------- MongoDB
  mongodb:
    image: mongo:7.0
    container_name: weather-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------- Spark Structured Streaming
  processor:
    build: ./processor
    container_name: weather-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      <<: [*kafka-env, *mongo-env]
      KAFKA_STARTING_OFFSETS: ${KAFKA_STARTING_OFFSETS:-latest}
      CHECKPOINT_LOCATION: /tmp/spark-weather-checkpoint
    ports:
      - "4040:4040"                            # Spark UI
    volumes:
      - spark-ivy:/tmp/spark-ivy               # caches the Kafka connector jars
      - spark-checkpoint:/tmp/spark-weather-checkpoint
    healthcheck:
      # The Spark UI answers only while the application is running.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4040/api/v1/applications', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s                       # first start downloads the connector jars
    restart: unless-stopped

  # ---------------------------------------------------------------- WeatherAPI producer
  producer:
    build: ./producer
    container_name: weather-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      WEATHER_API_KEY: ${WEATHER_API_KEY:?Set WEATHER_API_KEY in your .env file (copy .env)}
      WEATHER_LOCATION: ${WEATHER_LOCATION:-Manila}
      POLL_SECONDS: ${POLL_SECONDS:-60}
    restart: unless-stopped

  # ---------------------------------------------------------------- Streamlit dashboard
  dashboard:
    build: ./dashboard
    container_name: weather-dashboard
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      <<: *mongo-env
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-Asia/Manila}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-20}
      DASHBOARD_DEMO_MODE: ${DASHBOARD_DEMO_MODE:-false}
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  kafka-data:
  mongo-data:
  spark-ivy:
  spark-checkpoint:
